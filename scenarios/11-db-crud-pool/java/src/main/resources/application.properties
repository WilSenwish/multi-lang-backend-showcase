server.port=8125
spring.application.name=db-crud-pool

# JSON 字段统一 snake_case（createdAt → created_at，与 Go/Rust/Python/TS 对齐；
# 02 场景同款修复：否则 Java 默认 camelCase，跨语言响应比对会静默不一致）
spring.jackson.property-naming-strategy=SNAKE_CASE

# SQLite 配置（内存数据库或文件数据库）
spring.datasource.url=jdbc:sqlite:./demo.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=admin
spring.datasource.password=

# HikariCP 连接池配置（Spring Boot 默认就是 HikariCP）
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA / Hibernate 配置
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# 自动建表
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
