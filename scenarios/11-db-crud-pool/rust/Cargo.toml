[package]
name = "db-crud-pool"
version = "1.0.0"
edition = "2021"
description = "Multi-Lang-Backend-Showcase: Rust DB CRUD (sqlx + SQLite)"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# sqlx：Rust 数据库访问事实标准
# 核心亮点：compile-time SQL checking（编译期校验 SQL 语法、类型、表结构）
# 这是 Java/Python/Go/TS 都做不到的！
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }

[profile.release]
opt-level = 3
lto = true
