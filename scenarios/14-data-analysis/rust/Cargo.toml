[package]
name = "data-analysis"
version = "1.0.0"
edition = "2021"
description = "Multi-Lang-Backend-Showcase: Rust 数据分析处理（polars）"

[dependencies]
axum = "0.7"
polars = { version = "0.55", features = ["lazy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = true
