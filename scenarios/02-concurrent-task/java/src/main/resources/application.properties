server.port=8085
spring.application.name=concurrent-task

# 关键：本仓库其余 4 门语言默认输出 snake_case，而 Jackson 默认是 camelCase。
# 不做这个配置，Java 会输出 totalTasks / totalTimeMs，与 Go/Python/Rust/TS 的
# total_tasks / total_time_ms 不匹配，“统一契约”就名存实亡。
# 注意该策略同时作用于反序列化：RunRequest 的字段名也会按 snake_case 绑定，
# 即 README 文档里的 {"task_count":100,...} 才能真正生效（此前只能靠默认值碰巧蒙对）。
spring.jackson.property-naming-strategy=SNAKE_CASE
