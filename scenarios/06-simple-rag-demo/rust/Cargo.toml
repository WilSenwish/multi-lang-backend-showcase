[package]
name = "simple-rag"
version = "1.0.0"
edition = "2021"
description = "multi-lang-backend-showcase: Rust 轻量 RAG Demo"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
regex = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = true
