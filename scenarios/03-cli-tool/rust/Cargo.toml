[package]
name = "count"
version = "1.0.0"
edition = "2021"
description = "Multi-Lang-Backend-Showcase: Rust wc 命令行工具"

[dependencies]
clap = { version = "4", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = true
strip = true
