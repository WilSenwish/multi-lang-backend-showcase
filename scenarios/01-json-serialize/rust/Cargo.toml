[package]
name = "json-serialize"
version = "1.0.0"
edition = "2021"
description = "Multi-Lang-Backend-Showcase: Rust serde JSON 序列化对比"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = 3
lto = true
