[package]
name = "rate-limit"
version = "1.0.0"
edition = "2021"
description = "Multi-Lang-Backend-Showcase: Rust token-bucket rate limiter"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# governor：Rust 生态最成熟的限流库（支持 TokenBucket / SlidingWindow / FixedWindow）
# 这里手写实现避免额外下载（手写性能一样好）

[profile.release]
opt-level = 3
lto = true
