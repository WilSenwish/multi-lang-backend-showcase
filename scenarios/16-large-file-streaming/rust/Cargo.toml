[package]
name = "large-file-streaming"
version = "1.0.0"
edition = "2021"
description = "multi-lang-backend-showcase: Rust 大文件流式处理（固定缓冲 + 手写行边界 + 自定义分配器计内存）"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
libc = "0.2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = true
