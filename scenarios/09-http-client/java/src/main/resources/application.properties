server.port=8115
spring.application.name=http-client

# Resilience4j 配置（重试 + 熔断）
resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 100ms
        retry-exceptions: java.io.IOException,org.springframework.web.client.HttpServerErrorException
    instances:
      httpCall:
        base-config: default
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
    instances:
      httpCall:
        base-config: default

# Mock 目标服务端口（内置，8200）
mock-server.port=8200
