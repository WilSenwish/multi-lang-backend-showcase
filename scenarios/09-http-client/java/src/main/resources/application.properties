server.port=8115
spring.application.name=http-client

# Mock 目标服务端口（内置，8200）
mock-server.port=8200

# Resilience4j 熔断配置（注意：.properties 必须是点分隔键，不能写 YAML 缩进——
# 老文件把 YAML 语法抄进 .properties，键名变成 "resilience4j:"/"max-attempts" 这种
# 谁也匹配不上的形式，Resilience4j 全程用默认值，熔断阈值 100 次调用根本打不开）
# 语义与其他四门语言对齐（3 次失败后熔断、OPEN 10s 后半开）：
#   - 其余四门是"连续失败 3 次"计数；Resilience4j 是"窗口内失败率 ≥50% 且调用数达标"，
#     取 minimum-number-of-calls=5 后，在验证用例序列（2 次成功 + 3 次失败）上
#     观测点完全一致：第 3 次失败正常执行并记账，第 4 次调用被拒（CIRCUIT_OPEN）。
resilience4j.circuitbreaker.instances.httpCall.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.httpCall.sliding-window-size=10
resilience4j.circuitbreaker.instances.httpCall.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.httpCall.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.httpCall.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.httpCall.automatic-transition-from-open-to-half-open-enabled=true
