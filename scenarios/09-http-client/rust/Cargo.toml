[package]
name = "http-client"
version = "1.0.0"
edition = "2021"
description = "Multi-Lang-Backend-Showcase: Rust HTTP client with retry/circuit-breaker"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Rust 最流行的 HTTP 客户端：reqwest
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
