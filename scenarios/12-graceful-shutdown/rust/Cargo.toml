[package]
name = "graceful-shutdown"
version = "1.0.0"
edition = "2021"
description = "multi-lang-backend-showcase: Rust graceful shutdown (axum + tokio)"

[dependencies]
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
opt-level = 3
lto = true
